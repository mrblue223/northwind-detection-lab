---
- name: Read the fake employee roster
  community.general.read_csv:
    path: "{{ users_csv_path }}"
  delegate_to: localhost
  become: false
  register: roster

- name: Build the distinct OU list from the roster
  ansible.builtin.set_fact:
    departments: "{{ roster.list | map(attribute='ou') | unique | list }}"

- name: Create an OU per department
  microsoft.ad.ou:
    name: "{{ item }}"
    path: "DC=northwind,DC=local"
    state: present
  loop: "{{ departments }}"

- name: Create a security group per department
  microsoft.ad.group:
    name: "GRP-{{ item }}"
    scope: global
    path: "OU={{ item }},DC=northwind,DC=local"
    state: present
  loop: "{{ departments }}"

- name: Create each user, placed in their department OU
  microsoft.ad.user:
    # name is the LDAP cn; keep it equal to the sAMAccountName so the DN
    # (CN=<sam>,OU=...) is unchanged from the old win_domain_user behaviour.
    name: "{{ item.samaccountname }}"
    sam_account_name: "{{ item.samaccountname }}"
    firstname: "{{ item.first_name }}"
    surname: "{{ item.last_name }}"
    company: "Northwind Dental"
    description: "{{ item.title }}"
    path: "OU={{ item.ou }},DC=northwind,DC=local"
    password: "ChangeMe!{{ 1000 | random }}"
    # "must change password at next logon" is now password_expired, which is
    # mutually exclusive with password_never_expires - so the old explicit
    # password_never_expires: false (the default anyway) is dropped.
    password_expired: true
    user_cannot_change_password: false
    # department has no dedicated argument in microsoft.ad.user; set the raw
    # LDAP attribute instead.
    attributes:
      set:
        department: "{{ item.department }}"
    # groups is now a dict of add/remove/set; set replaces membership, which
    # matches the old win_domain_user default groups_action of replace.
    groups:
      set:
        - "GRP-{{ item.ou }}"
    state: present
  loop: "{{ roster.list }}"
  when: item.samaccountname != weak_service_account # service account handled in weaknesses role
