---
- name: Join WS01 to the domain
  ansible.windows.win_domain_membership:
    dns_domain_name: "{{ domain_name }}"
    domain_admin_user: "{{ domain_admin_user }}@{{ domain_name }}"
    domain_admin_password: "{{ domain_admin_password }}"
    state: domain
  register: join_result

- name: Reboot after domain join
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: join_result is changed

- name: Ensure a standard (non-admin) domain user is set as the regular logon account
  ansible.windows.win_shell: |
    Add-LocalGroupMember -Group "Remote Desktop Users" -Member "NORTHWIND\lchen" -ErrorAction SilentlyContinue
  # lchen (Lisa Chen, Dental Hygienist) plays the phishing victim - picked
  # because she's an ordinary user with no elevated rights, which is the
  # realistic case for a phishing target.

- name: Install a browser and basic office tooling for realism
  ansible.windows.win_chocolatey:
    name:
      - googlechrome
      - notepadplusplus
    state: present
  ignore_errors: true # chocolatey install can be flaky in a lab; not critical path

- name: Note on email client
  ansible.builtin.debug:
    msg: >
      Outlook/M365 apps are not scripted here (licensing). For the phishing
      simulation (attack-chain/01-initial-access-phishing.md), either
      install a trial of Microsoft 365 Apps manually, or simulate the
      "click" by manually fetching/executing the SET payload as lchen -
      the simpler and recommended v1 approach per PLAN.md Phase 4a.
