---
# This is the step most likely to need babysitting on the first run.
# Promotion reboots the box; if Ansible loses the connection mid-task,
# re-run the playbook - the `when: not domain_already_exists` guard
# below makes this idempotent.

- name: Check whether the domain is already provisioned
  ansible.windows.win_shell: |
    try {
      Get-ADDomain | Out-Null
      "present"
    } catch {
      "absent"
    }
  register: domain_check
  changed_when: false
  failed_when: false

- name: Install AD-Domain-Services and management tools
  ansible.windows.win_feature:
    name:
      - AD-Domain-Services
      - RSAT-AD-AdminCenter
      - RSAT-AD-PowerShell
      - DNS
    include_management_tools: true
    state: present
  when: "'present' not in domain_check.stdout"
  register: feature_install

- name: Promote to a new forest
  ansible.windows.win_domain:
    dns_domain_name: "{{ domain_name }}"
    domain_netbios_name: "{{ domain_netbios_name }}"
    safe_mode_password: "{{ domain_admin_password }}"
  when: "'present' not in domain_check.stdout"
  register: promotion

- name: Reboot after promotion
  ansible.windows.win_reboot:
    reboot_timeout: 900
    connect_timeout: 30
    post_reboot_delay: 30
  when: promotion is changed

- name: Wait for AD DS to come fully online after reboot
  ansible.windows.win_shell: Get-ADDomain
  register: post_reboot_check
  until: post_reboot_check.rc == 0
  retries: 10
  delay: 30
  when: promotion is changed

- name: Copy the replication-rights SACL audit script
  ansible.windows.win_copy:
    src: add-replication-audit-sacl.ps1
    dest: C:\Temp\add-replication-audit-sacl.ps1

- name: Apply the SACL audit rule for DS-Replication-Get-Changes (feeds detections/10-dcsync-rights-abuse.kql)
  ansible.windows.win_shell: C:\Temp\add-replication-audit-sacl.ps1
  register: sacl_result
  changed_when: "'added' in sacl_result.stdout"
