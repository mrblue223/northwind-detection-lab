---
# Collections the playbook depends on. ansible-lint's syntax-check must be
# able to resolve every module (notably microsoft.ad, which replaced the
# removed ansible.windows.win_domain* modules), so CI installs these before
# linting. Pinned to major versions that contain the modules in use.
collections:
  - name: microsoft.ad
    version: ">=1.0.0"
  - name: ansible.windows
    version: ">=2.0.0"
  - name: community.windows
    version: ">=2.0.0"
  - name: community.general
    version: ">=8.0.0"
  - name: chocolatey.chocolatey
    version: ">=1.5.0"
