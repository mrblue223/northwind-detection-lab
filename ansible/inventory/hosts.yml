---
# These IPs match terraform/20-compute/main.tf's `local.hosts` map. If you
# change that map, update this file (or better: generate it with
# `terraform -chdir=../terraform/20-compute output -json host_private_ips`
# piped into a small script - left as a stretch goal).

all:
  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5986
    ansible_user: labadmin
    # ansible_password pulled from Key Vault - do not hardcode here.
    # Export it before running: export ANSIBLE_WINRM_PASSWORD=$(az keyvault
    # secret show --vault-name kv-northwind-lab --name domain-admin-password
    # --query value -o tsv), then reference via lookup or env in group_vars.

  children:
    domain_controllers:
      hosts:
        dc01:
          ansible_host: 10.10.2.10

    workstations:
      hosts:
        ws01:
          ansible_host: 10.10.2.11

    file_servers:
      hosts:
        fs01:
          ansible_host: 10.10.2.12

    windows:
      children:
        domain_controllers:
        workstations:
        file_servers:

    scanners:
      hosts:
        scan01:
          ansible_host: 10.10.1.11
          ansible_connection: ssh
          ansible_user: scanadmin
          ansible_ssh_private_key_file: "{{ lookup('env', 'SCAN01_SSH_KEY_PATH') }}"
          # Private key pulled from Key Vault secret `scan01-ssh-private-key`
          # (see terraform/20-compute/main.tf) and saved to a local path
          # referenced by this env var - don't commit the key itself.
