# Manual apply only - this project is a cost-sensitive personal lab, not a
# service that should auto-deploy on every merge. Gated behind a GitHub
# Environment ("lab-apply") with a required reviewer, so an apply can't run
# unattended even if someone (including you, by accident) triggers it.
#
name: Terraform Apply (manual)

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Which stack to apply"
        required: true
        type: choice
        options:
          - 00-foundation
          - 10-network
          - 05-policy
          - 15-access
          - 20-compute
          - 30-identity
          - 40-sentinel

permissions:
  id-token: write # OIDC - no stored Azure credentials anywhere in this repo
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: lab-apply # configure this in repo Settings > Environments with a required reviewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Init
        run: terraform -chdir="terraform/${{ inputs.stack }}" init

      - name: Plan
        run: terraform -chdir="terraform/${{ inputs.stack }}" plan -out=tfplan

      - name: Apply (requires environment approval above)
        run: terraform -chdir="terraform/${{ inputs.stack }}" apply -auto-approve tfplan
