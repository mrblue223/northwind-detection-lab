name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-fmt:
    name: Terraform fmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: fmt -check on every stack
        run: |
          for dir in terraform/*/; do
            echo "== $dir =="
            terraform -chdir="$dir" fmt -check -recursive
          done

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.54.0
      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run TFLint on every stack
        run: |
          for dir in terraform/*/; do
            echo "== $dir =="
            tflint --chdir="$dir" --recursive
          done

  checkov:
    name: Checkov (IaC security/misconfig scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Run Checkov via pip (pinned) rather than the Docker action: the action's
      # bundled image (checkov 2.0.930) rejected the cli,sarif output format and
      # never actually scanned. This version matches what is validated locally.
      - name: Install Checkov
        run: pip install checkov==3.4.4
      - name: Run Checkov
        # Hard gate (no soft-fail): non-zero exit on any finding fails the job.
        # Writes results_sarif.sarif and prints the summary to the log.
        run: checkov -d terraform --framework terraform -o sarif --output-file-path .
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true # reporting is best-effort; the gate is Checkov's exit code
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: results_sarif.sarif

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ansible-lint
        run: pip install ansible-lint ansible
      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Run ansible-lint
        run: ansible-lint ansible/

  terraform-plan:
    name: Terraform plan (PR comment only, no apply)
    runs-on: ubuntu-latest
    needs: [terraform-fmt, tflint, checkov, gitleaks]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      id-token: write # OIDC to Azure, no stored credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Plan each stack and comment
        run: |
          for dir in terraform/00-foundation terraform/10-network terraform/15-access terraform/20-compute terraform/40-sentinel terraform/05-policy; do
            echo "::group::plan $dir"
            terraform -chdir="$dir" init -backend=true
            terraform -chdir="$dir" plan -no-color || true
            echo "::endgroup::"
          done
      # A real setup would capture plan output per-stack and post via
      # actions/github-script as a PR comment. Left intentionally simple
      # here - see PLAN.md for this as a documented stretch goal.
